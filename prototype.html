<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calibration Copilot — working prototype</title>
<!--
  WORKING PROTOTYPE — commit-first, reveal-after, wired to a local LLM.

  TO RUN THE REAL MODEL (Ollama):
  1. Install Ollama, then: ollama pull llama3.1   (or any chat model)
  2. Ollama must allow this page's origin. Start it with CORS open:
       OLLAMA_ORIGINS='*' ollama serve
     (on macOS: launchctl setenv OLLAMA_ORIGINS '*' then restart Ollama)
  3. Open this file in a browser. The badge top-right shows "Ollama: connected".
  4. If it can't reach localhost:11434, it falls back to canned responses so
     the flow still demos — badge shows "Mock mode".

  Change the model name in CONFIG.model below to whatever you pulled.
-->
<style>
  :root {
    --bg:#f4f7fb;--card:#fff;--border:#e5e9f0;--text:#1a1d24;--text-2:#4b5563;--label:#9aa1ad;
    --amber:#b45309;--gold:#92600a;--gold-bg:#fdf6e3;--gold-border:#e7c876;
    --green:#15803d;--green-bg:#ecfdf3;--green-border:#bbe7c9;
    --purple:#6d28d9;--purple-bg:#f3efff;--chip-bg:#f1f3f6;
    --amber-bg:#fffbeb;--amber-border:#fcd34d;--radius:14px;font-size:15px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:#e9edf3;color:var(--text);display:grid;grid-template-columns:300px 1fr;min-height:100vh;}
  .label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--label);font-weight:650;margin-bottom:6px;}
  .tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid;
    color:var(--gold);background:var(--gold-bg);border-color:var(--gold-border);}

  /* queue */
  .queue{background:#fafbfd;border-right:1px solid var(--border);padding:20px 14px;overflow-y:auto;max-height:100vh;}
  .q-title{font-size:15px;font-weight:750;margin:2px 6px 14px;}
  .qrow{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
  .qrow:hover{border-color:#c9d2e0;}
  .qrow.sel{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple);}
  .qr1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .qr1 .n{font-size:13.5px;font-weight:650;}
  .qr1 .a{font-size:13px;font-weight:750;}
  .qr2{font-size:11.5px;color:var(--label);margin-top:4px;font-family:ui-monospace,Menlo,monospace;}
  .qr3{margin-top:7px;}
  .mini-tag{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--gold-border);color:var(--gold);background:var(--gold-bg);}

  /* main */
  .main{padding:26px 34px;overflow-y:auto;max-height:100vh;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  .brand{font-size:13px;font-weight:750;}
  .brand small{display:block;font-size:10px;letter-spacing:.14em;color:var(--label);font-weight:650;margin-top:2px;}
  .status-badge{font-size:11.5px;font-weight:650;padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);background:var(--card);}
  .status-badge.ok{color:var(--green);background:var(--green-bg);border-color:var(--green-border);}
  .status-badge.mock{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-border);}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 26px;margin-bottom:18px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .case-head{display:flex;justify-content:space-between;align-items:flex-start;}
  .cust-name{font-size:18px;font-weight:750;margin-bottom:3px;}
  .cust-meta{font-size:13px;color:var(--text-2);}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .stat-val{font-size:18px;font-weight:750;}
  .stat-val.warn{color:var(--amber);}
  .contact{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
  .contact p{font-size:13px;color:var(--text-2);line-height:1.55;}

  .option{display:flex;align-items:center;gap:11px;border:1px solid var(--border);border-radius:10px;padding:12px 15px;margin-bottom:8px;font-size:14px;cursor:pointer;}
  .option:hover{border-color:#c3cad6;}
  .option.selected{border-color:var(--text);background:#fafbfc;font-weight:650;}
  .radio{width:15px;height:15px;border-radius:50%;border:1.5px solid #c3cad6;flex-shrink:0;}
  .option.selected .radio{border:5px solid var(--text);}
  .btn{display:block;width:100%;text-align:center;border-radius:10px;padding:13px;font-size:14px;font-weight:650;cursor:pointer;border:1px solid var(--text);background:var(--text);color:#fff;margin-top:4px;}
  .btn:disabled{background:#eef1f5;color:#a6adba;border:none;cursor:default;}
  .locknote{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-top:10px;font-size:12.5px;color:var(--text-2);}
  .committed{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);background:#fafbfc;border-radius:10px;padding:13px 16px;}
  .committed .what{font-size:14.5px;font-weight:650;}
  .committed .when{font-size:12px;color:var(--text-2);font-weight:600;}
  .fin-note{font-size:12px;color:var(--label);margin-top:9px;line-height:1.5;}

  .locked{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 28px;border:1.5px dashed #cad2de;border-radius:var(--radius);background:rgba(26,29,36,.02);text-align:center;min-height:260px;}
  .locked .ic{width:42px;height:42px;border-radius:50%;background:var(--chip-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;}
  .locked h4{font-size:14.5px;font-weight:700;color:var(--text-2);}
  .locked p{font-size:12.5px;color:var(--label);line-height:1.6;max-width:300px;}
  .spinner{width:26px;height:26px;border:3px solid var(--chip-bg);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .ai-head{display:flex;align-items:center;gap:12px;}
  .ai-icon{width:30px;height:30px;border-radius:50%;background:var(--purple-bg);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--purple);flex-shrink:0;}
  .ai-rec-title{font-size:17px;font-weight:750;}
  .reasoning{font-size:13.5px;color:var(--text-2);line-height:1.6;margin-top:14px;}
  .policy-ref{display:flex;gap:9px;background:#f8f9fb;border:1px solid var(--border);border-radius:10px;padding:11px 15px;margin-top:13px;font-size:13px;color:var(--text-2);flex-wrap:wrap;}
  .policy-ref b{color:var(--text);}
  .outcome-note{display:flex;align-items:center;gap:8px;margin-top:13px;border:1px solid var(--border);background:var(--chip-bg);border-radius:10px;padding:11px 15px;font-size:13px;color:var(--text-2);font-weight:600;}
  .outcome-note .eq{font-weight:700;color:var(--label);}
  .conf{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin:6px 0 11px;}
  .dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;}
  .banner{border-radius:10px;padding:11px 14px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber);}
  .chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .chip{background:var(--chip-bg);border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--text-2);}
  .raw{margin-top:14px;font-size:11px;color:var(--label);cursor:pointer;}
  .raw pre{background:#101418;color:#d7dde5;border-radius:8px;padding:12px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;overflow-x:auto;white-space:pre-wrap;}
  .next-row{display:flex;justify-content:space-between;margin-top:auto;padding-top:20px;}
  .ghost{border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:650;cursor:pointer;}
  .next-case{border:1px solid var(--text);background:var(--text);color:#fff;border-radius:10px;padding:11px 20px;font-size:13.5px;font-weight:650;cursor:pointer;}

  /* calibration log */
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--label);font-weight:650;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:10px;font-size:12.5px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--text-2);}
  .rel{text-align:center;font-weight:600;color:var(--label);}
  .sp{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid;}
  .sp.pending{color:var(--text-2);background:var(--chip-bg);border-color:var(--border);}
  .sp.review{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-border);}
  .empty-log{font-size:12.5px;color:var(--label);padding:16px 10px;}
</style>
</head>
<body>

<aside class="queue">
  <div class="q-title">My Queue</div>
  <div id="queueList"></div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="brand">Calibration Copilot<small>WORKING PROTOTYPE</small></div>
    <div id="statusBadge" class="status-badge">Checking model…</div>
  </div>

  <div class="grid">
    <div id="leftCol"></div>
    <div id="rightCol"></div>
  </div>

  <div class="card" style="margin-top:4px;">
    <div class="label">Calibration Log · this session</div>
    <div id="logWrap"></div>
  </div>
</main>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  endpoint: "http://localhost:11434/api/generate",
  model: "llama3.1",           // change to whatever you `ollama pull`ed
};

/* ============ SYSTEM PROMPT (the exhibit) ============ */
const SYSTEM_PROMPT = `You are a decision-support model for collections agents at an Indian NBFC.
You will receive case details as JSON: customer name, account type, amount overdue, days past due, hardship flag, last-contact notes, last payment, and promises (kept, broken).
Treat missing fields as unknown, not as zero or false.

Recommend exactly ONE of these four actions (use the exact text):
- 30-day extension
- Convert to EMI
- Single settlement
- Escalate to lead

Never combine actions or suggest conditional paths.

When choosing between sections: §6.1 overrides all other sections — if it applies, escalate. When multiple sections merely permit different actions, that is not a conflict; it is a judgment call. Recommend the action from the section most specific to the case facts and cite that section. (Example: a hardship-flagged account may qualify for both an extension under §3.3 and EMI conversion under §4.2 — §4.2 is the more specific match for hardship facts.)

Respond with ONLY valid JSON, no other text:
{"recommendation": "...", "reasoning": "...", "policy_ref": "...", "confidence": "high" or "low"}

In reasoning, cite only facts from the input or the policy below — never statistics or history you were not given. Keep it to 2–3 sentences.

IMPORTANT: Set confidence to "low" and recommendation to null ONLY when:
- the case is unworkably thin: no last-contact notes AND no last payment AND no promises recorded, or days past due or amount overdue missing; or
- the facts contradict each other; or
- policy sections mandate contradictory handling of the same case — mandate, not merely permit.
In that case, list the relevant policy sections in policy_ref, and reasoning must name the specific gap or contradiction in one sentence.

Policy reference (synthetic, for demo):
§4.2 — Hardship restructure: EMI conversion allowed when hardship flag is set, days past due is 30–90, and an income-disruption note is on file.
§5.1 — Settlement authority: settlements only when days past due exceeds 90 or a legal notice has been issued. Agents may approve waivers up to 40% on amounts up to Rs 1,00,000; beyond either limit requires lead approval.
§3.3 — Extensions: one 30-day extension per account, only when days past due is under 60 and the borrower has at most one broken promise on record.
§6.1 — Mandatory escalation: escalate when legal counsel is engaged, the borrower disputes the debt, or amount overdue exceeds Rs 2,50,000.`;

/* ============ CASES ============ */
const OPTIONS = ["30-day extension","Convert to EMI","Single settlement","Escalate to lead"];
const CASES = [
  { id:"CG-317082", name:"Priya Venkataraman", type:"Revolving Credit", hardship:true,
    amount:54200, dpd:47, promises:{kept:2,broken:1}, last_payment:{amount:6200,date:"2026-05-12"},
    notes:"Customer cited job loss since March; income-disruption note on file. Requesting EMI restructure." },
  { id:"CG-500193", name:"Venkatasubramaniam Krishnamurthy", type:"Business Overdraft", hardship:false,
    amount:324800, dpd:74, promises:{kept:0,broken:2}, last_payment:null,
    notes:"Legal counsel engaged. Counsel requested 30-day hold pending litigation review." },
  { id:"CG-209441", name:"Rajesh Sharma", type:"Personal Loan", hardship:false,
    amount:18500, dpd:22, promises:{kept:1,broken:0}, last_payment:{amount:4000,date:"2026-06-20"},
    notes:"Confirmed receipt of notice, requested callback tomorrow morning." },
  { id:"CG-990001", name:"New Account (thin file)", type:"Personal Loan", hardship:false,
    amount:9900, dpd:12, promises:{kept:0,broken:0}, last_payment:null,
    notes:"" },
];

/* ============ MOCK FALLBACK (used when Ollama unreachable) ============ */
const MOCKS = {
  "CG-317082":{recommendation:"Convert to EMI",reasoning:"Hardship flag is set with an income-disruption note on file and days past due (47) falls in the 30–90 range, so §4.2 applies most specifically. An extension is also permitted under §3.3, but §4.2 is the closer match for hardship facts.",policy_ref:"§4.2",confidence:"high"},
  "CG-500193":{recommendation:"Escalate to lead",reasoning:"Legal counsel is engaged and the amount overdue (Rs 3,24,800) exceeds Rs 2,50,000, both of which trigger §6.1 mandatory escalation. §6.1 overrides all other sections.",policy_ref:"§6.1",confidence:"high"},
  "CG-209441":{recommendation:"30-day extension",reasoning:"Days past due (22) is under 60 and the borrower has no broken promises on record, satisfying §3.3. No hardship flag or legal trigger applies.",policy_ref:"§3.3",confidence:"high"},
  "CG-990001":{recommendation:null,reasoning:"The case is unworkably thin: no last-contact notes, no last payment, and no promises recorded.",policy_ref:["§3.3","§4.2"],confidence:"low"},
};

/* ============ STATE ============ */
let selectedCase = CASES[0];
let picked = null;          // agent's selected option
let committed = null;       // committed option string
let aiResult = null;        // parsed model output
let phase = "deciding";     // deciding | loading | revealed
let rawResponse = "";
let modelOnline = false;
const log = [];

/* ============ MODEL CALL ============ */
async function checkModel(){
  try{
    const r = await fetch("http://localhost:11434/api/tags",{method:"GET"});
    modelOnline = r.ok;
  }catch(e){ modelOnline = false; }
  const b = document.getElementById("statusBadge");
  if(modelOnline){ b.className="status-badge ok"; b.textContent="Ollama: connected · "+CONFIG.model; }
  else{ b.className="status-badge mock"; b.textContent="Mock mode (Ollama not reachable)"; }
}

async function askModel(c){
  const userMsg = "Case:\n"+JSON.stringify({
    customer_name:c.name, account_type:c.type, amount_overdue_inr:c.amount,
    days_past_due:c.dpd, hardship_flag:c.hardship, last_contact_notes:c.notes||null,
    last_payment:c.last_payment, promises:c.promises
  },null,2);

  if(!modelOnline){
    await new Promise(r=>setTimeout(r,700));
    rawResponse = JSON.stringify(MOCKS[c.id],null,2);
    return MOCKS[c.id];
  }
  const res = await fetch(CONFIG.endpoint,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:CONFIG.model,system:SYSTEM_PROMPT,prompt:userMsg,stream:false,format:"json",options:{temperature:0.2}})
  });
  const data = await res.json();
  rawResponse = data.response || "";
  // Parse — this is the failure-absorption point. Bad JSON → treat as low confidence.
  try{
    const parsed = JSON.parse(rawResponse);
    if(!("recommendation" in parsed)) throw new Error("missing field");
    return parsed;
  }catch(e){
    return {recommendation:null,reasoning:"The model returned output that did not match the required contract, so no recommendation is shown. (Parse error: "+e.message+")",policy_ref:["§3.3","§4.2","§5.1","§6.1"],confidence:"low"};
  }
}

/* ============ RENDER ============ */
function renderQueue(){
  document.getElementById("queueList").innerHTML = CASES.map(c=>`
    <div class="qrow ${c.id===selectedCase.id?'sel':''}" onclick="selectCase('${c.id}')">
      <div class="qr1"><span class="n">${c.name.length>22?c.name.slice(0,20)+'…':c.name}</span><span class="a">₹${c.amount.toLocaleString('en-IN')}</span></div>
      <div class="qr2">${c.id} · ${c.dpd}d</div>
      ${c.hardship?'<div class="qr3"><span class="mini-tag">Hardship</span></div>':''}
    </div>`).join("");
}

function renderCaseCard(){
  const c=selectedCase;
  return `<div class="card">
    <div class="case-head">
      <div><div class="label">Customer</div><div class="cust-name">${c.name}</div>
      <div class="cust-meta">${c.id} · ${c.type}</div></div>
      ${c.hardship?'<span class="tag">Hardship</span>':''}
    </div>
    <div class="stats">
      <div><div class="label">Amount Overdue</div><div class="stat-val">₹${c.amount.toLocaleString('en-IN')}</div></div>
      <div><div class="label">Days Past Due</div><div class="stat-val ${c.dpd>=45?'warn':''}">${c.dpd}</div></div>
    </div>
    <div class="contact"><div class="label">Last Contact</div><p>${c.notes||'<em style="color:#b9c0cc">No contact notes on file.</em>'}</p></div>
  </div>`;
}

function renderCommit(){
  if(phase==="deciding"){
    return `<div class="card">
      <div class="label" style="margin-bottom:12px;">Your Decision</div>
      ${OPTIONS.map(o=>`<div class="option ${picked===o?'selected':''}" onclick="pick('${o}')"><span class="radio"></span> ${o}</div>`).join("")}
      <button class="btn" ${picked?'':'disabled'} onclick="commit()">Commit Decision</button>
      <div class="locknote">🔒 AI reasoning unlocks after commit</div>
    </div>`;
  }
  return `<div class="card">
    <div class="label" style="margin-bottom:12px;">Your Decision</div>
    <div class="committed"><span class="what">${committed}</span><span class="when">Committed · ${nowTime()}</span></div>
    <p class="fin-note">Decisions are final once committed. If your call differs from the AI's, the difference is logged to your calibration record.</p>
  </div>`;
}

function renderReveal(){
  if(phase==="deciding"){
    return `<div class="locked"><div class="ic">🔒</div><h4>AI reasoning locked</h4>
      <p>Commit your decision to reveal. Your call is logged first so the comparison stays honest — the AI can't anchor you, and you can't anchor it.</p></div>`;
  }
  if(phase==="loading"){
    return `<div class="locked"><div class="spinner"></div><h4>Consulting the model…</h4>
      <p>${modelOnline?CONFIG.model+' via Ollama':'mock response'}</p></div>`;
  }
  // revealed
  const r=aiResult;
  const rawBlock=`<div class="raw" onclick="this.querySelector('pre').style.display=this.querySelector('pre').style.display==='none'?'block':'none'">▸ raw model output
    <pre style="display:none">${escapeHtml(rawResponse)}</pre></div>`;
  if(r.recommendation===null){
    const refs=Array.isArray(r.policy_ref)?r.policy_ref:[r.policy_ref];
    return `<div class="card" style="display:flex;flex-direction:column;min-height:260px;">
      <div class="label">AI Recommendation</div>
      <div class="conf"><span class="dot"></span> Low Confidence</div>
      <div class="banner">No recommendation</div>
      <p class="reasoning">${r.reasoning||''}</p>
      <div class="label" style="margin-top:14px;">Relevant Policy Sections</div>
      <div class="chips">${refs.map(s=>`<span class="chip">${s}</span>`).join("")}</div>
      ${rawBlock}
      <div class="next-row"><span class="ghost" onclick="reset()">Re-decide</span><span class="next-case" onclick="nextCase()">Next case →</span></div>
    </div>`;
  }
  const match = committed===r.recommendation;
  return `<div class="card" style="display:flex;flex-direction:column;min-height:260px;">
    <div class="ai-head"><div class="ai-icon">✦</div>
      <div><div class="label" style="margin-bottom:2px;">AI Recommendation</div><div class="ai-rec-title">${r.recommendation}</div></div></div>
    <div class="label" style="margin-top:16px;">Reasoning</div>
    <p class="reasoning">${r.reasoning||''}</p>
    <div class="policy-ref">§ Policy ref: <b>${Array.isArray(r.policy_ref)?r.policy_ref.join(', '):r.policy_ref}</b></div>
    <div class="outcome-note"><span class="eq">${match?'=':'≠'}</span> ${match?"Logged — matched the AI's call · pending policy check":"Your call differs from the AI's — logged to your calibration record"}</div>
    ${rawBlock}
    <div class="next-row"><span class="ghost" onclick="reset()">Re-decide</span><span class="next-case" onclick="nextCase()">Next case →</span></div>
  </div>`;
}

function renderLog(){
  const w=document.getElementById("logWrap");
  if(log.length===0){ w.innerHTML=`<div class="empty-log">No decisions committed yet. Commit a case above and it appears here.</div>`; return; }
  w.innerHTML=`<table><thead><tr><th>Case #</th><th>Your Call</th><th>AI Call</th><th style="text-align:center">=/≠</th><th>Status</th></tr></thead><tbody>
    ${log.map(e=>`<tr><td class="mono">${e.id}</td><td>${e.your}</td><td>${e.ai}</td>
      <td class="rel">${e.rel}</td><td><span class="sp ${e.rel==='≠'?'review':'pending'}">${e.rel==='≠'?'Under lead review':'Pending review'}</span></td></tr>`).join("")}
  </tbody></table>`;
}

function draw(){
  document.getElementById("leftCol").innerHTML = renderCaseCard()+renderCommit();
  document.getElementById("rightCol").innerHTML = renderReveal();
  renderLog();
}

/* ============ ACTIONS ============ */
function selectCase(id){ selectedCase=CASES.find(c=>c.id===id); reset(); renderQueue(); }
function pick(o){ if(phase==="deciding"){ picked=o; draw(); } }
function reset(){ picked=null; committed=null; aiResult=null; phase="deciding"; rawResponse=""; draw(); }
async function commit(){
  if(!picked) return;
  committed=picked; phase="loading"; draw();
  aiResult = await askModel(selectedCase);
  phase="revealed"; draw();
  const rec=aiResult.recommendation;
  log.unshift({id:selectedCase.id, your:committed, ai:rec===null?'— (low conf.)':rec, rel:(rec!==null&&rec===committed)?'=':'≠'});
  renderLog();
}
function nextCase(){
  const i=CASES.findIndex(c=>c.id===selectedCase.id);
  selectedCase=CASES[(i+1)%CASES.length]; reset(); renderQueue();
}
function nowTime(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function escapeHtml(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

/* ============ INIT ============ */
checkModel();
renderQueue();
draw();
</script>
